<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Icône de MY SIMPLE BACKUP : flèche de copie vers un disque externe.
       Source de Bundle/AppIcon.icns (régénérer avec : node Bundle/make_icon.mjs). -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AAEFF"/>
      <stop offset="1" stop-color="#0F4FC9"/>
    </linearGradient>
    <linearGradient id="reflet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="disque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D5DCE8"/>
    </linearGradient>
    <linearGradient id="fleche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EEFB"/>
    </linearGradient>
    <filter id="ombre" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="ombreDouce" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#06296E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond : carré arrondi selon la grille des icônes macOS (824 px dans 1024) -->
  <g filter="url(#ombre)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#fond)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#reflet)"/>
  </g>

  <!-- Flèche de sauvegarde descendant vers le disque -->
  <path filter="url(#ombreDouce)" fill="url(#fleche)"
        d="M 452 200 L 572 200 Q 592 200 592 220 L 592 412 L 668 412
           Q 692 412 676 430 L 530 590 Q 512 610 494 590 L 348 430
           Q 332 412 356 412 L 432 412 L 432 220 Q 432 200 452 200 Z"/>

  <!-- Disque externe -->
  <g filter="url(#ombreDouce)">
    <rect x="232" y="628" width="560" height="196" rx="56" fill="url(#disque)"/>
  </g>
  <rect x="232" y="628" width="560" height="196" rx="56" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="4"/>
  <!-- Fente et voyant -->
  <rect x="300" y="716" width="300" height="20" rx="10" fill="#9AA7BC"/>
  <circle cx="704" cy="726" r="22" fill="#34C759"/>
  <circle cx="698" cy="719" r="7" fill="#FFFFFF" fill-opacity="0.6"/>
</svg>
